name: AEPD Scraper Diario

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar librerías (Ligeras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el Bot RSS
        run: python src/scraper.py

      - name: 4b. Censo histórico (Wayback Machine, gratis)
        run: python src/backfill.py

      - name: 4c. Descargador nocturno del histórico (30 PDFs)
        run: python src/history_downloader.py

      - name: 5. Analizar con Inteligencia Artificial
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/analyzer.py

      - name: 6. Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizacion automatica y analisis IA"
          git pull --rebase origin main || true
          git push
